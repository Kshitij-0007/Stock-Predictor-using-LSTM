services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  ml-bridge:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1

  java-platform:
    build:
      context: ./spring-boot-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/stock_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - AI_BRIDGE_URL=http://ml-bridge:5000
    depends_on:
      database:
        condition: service_healthy
      ml-bridge:
        condition: service_started
