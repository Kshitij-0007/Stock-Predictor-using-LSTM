# ============================================
# AI Stock Predictor - Spring Boot Configuration
# ============================================

# Server
server.port=${PORT:8080}

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/stock_predictor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# H2 Fallback (uncomment below & comment MySQL above to use H2)
# ============================================
# spring.datasource.url=jdbc:h2:file:./data/stockdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGeneration2026StockPredictorApp}
app.jwt.expiration-ms=86400000

# ============================================
# JSP View Resolver
# ============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ============================================
# LSTM Flask Microservice
# ============================================
app.lstm.service.url=${AI_BRIDGE_URL:http://localhost:5000}

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=http://localhost:4200

# ============================================
# Debugging
# ============================================
logging.level.org.springframework=INFO
logging.level.com.stockpredictor=DEBUG
server.servlet.session.timeout=10m
